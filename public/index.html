<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bumper Cars Arena - Multiplayer</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="ui-layer">
        <!-- Settings Button -->
        <button id="settings-btn" onclick="toggleSettings()" class="hidden">⚙️</button>

        <div id="login-screen" class="screen">
            <div class="box">
                <h1>Bumper Cars Arena</h1>
                <p>Lái xe đụng nhau bay khỏi sàn mây!</p>
                <input type="text" id="player-name" placeholder="Nhập tên của bạn..." maxlength="15" autofocus>
                <select id="game-mode">
                    <option value="pvp">Chế độ PvP (Người vs Người)</option>
                    <option value="bot">Chế độ Bot (Cùng 10 Bots)</option>
                </select>
                <button onclick="joinGame()">Vào Chơi</button>
            </div>
        </div>

        <div id="game-ui" class="screen hidden">
            <div id="leaderboard">
                <h3>Bảng Xếp Hạng</h3>
                <ul id="leaderboard-list"></ul>
            </div>
            <div id="controls">
                <p>Điều khiển: <b>W A S D</b> hoặc <b>Mũi Tên</b></p>
                <p>Tab: <b>Ẩn/Hiện BXH</b></p>
                <p>Mục tiêu: <b>Húc người khác rớt khỏi Đảo Mây</b></p>
            </div>
        </div>

        <div id="death-screen" class="screen hidden">
            <div class="box death-box">
                <h1>Bạn Đã Bay Khỏi Sàn!</h1>
                <p id="death-message">Hãy lái cẩn thận hơn.</p>
                <button onclick="respawn()">Chơi Lại</button>
            </div>
        </div>

        <div id="settings-modal" class="screen hidden">
            <div class="box">
                <h2>Cài Đặt</h2>
                <div class="setting-item">
                    <label>Nhạc Nền (BGM):</label>
                    <input type="range" id="bgm-volume" min="0" max="1" step="0.1" value="0.5" onchange="updateVolume()">
                </div>
                <div class="setting-item">
                    <label>Âm Thanh (SFX):</label>
                    <input type="range" id="sfx-volume" min="0" max="1" step="0.1" value="0.5" onchange="updateVolume()">
                </div>
                <br>
                <button onclick="toggleSettings()">Đóng</button>
                <button onclick="quitGame()" style="background: #e74c3c; margin-left: 10px;">Thoát Game</button>
            </div>
        </div>
        
        <div id="kill-feed"></div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <script src="game.js"></script>
</body>
</html>
